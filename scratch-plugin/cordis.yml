# DSH 插件版 DeerFlow 加载配置（本 fork 自研插件）
# 用法：pnpm dsh web --patch ./scratch-plugin/cordis.yml
# 注意：deerflow 由 deerflow-dsh bundle 提供（headless/web profile 的 packages），
# 不要在这里再插 deerflow 行，否则 loader 报 duplicate entry id。

- insert:
    - id: amazon-ops-bridge
      name: '@deepseek-ai/dsh-amazon-ops-bridge'
      config:
        baseUrl: 'http://127.0.0.1:8001'
        mock: false

    - id: scheduler
      name: '@deepseek-ai/dsh-scheduler'
      config:
        dataPath: '.dsh-scheduler-jobs.json'
        scanIntervalSeconds: 60

    - id: memory
      name: '@deepseek-ai/dsh-memory'
      config:
        dataPath: '.dsh-memory.json'

    - id: notify
      name: '@deepseek-ai/dsh-notify'
      config:
        mock: true

    - id: rbac
      name: '@deepseek-ai/dsh-rbac'
      config:
        role: admin
        deny: []

    - id: amazon-ops-skill
      name: '@deepseek-ai/dsh-amazon-ops-skill'
