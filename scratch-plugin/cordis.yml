# DSH 插件版 DeerFlow 加载配置
# 用法：pnpm dsh web --patch ./scratch-plugin/cordis.yml

- insert:
    - id: amazon-ops-bridge
      name: '@deepseek-ai/dsh-amazon-ops-bridge'
      config:
        baseUrl: 'http://127.0.0.1:8001'
        mock: false

    - id: scheduler
      name: '@deepseek-ai/dsh-scheduler'
      config:
        dataPath: '.dsh-scheduler-jobs.json'
        scanIntervalSeconds: 60

    - id: memory
      name: '@deepseek-ai/dsh-memory'
      config:
        dataPath: '.dsh-memory.json'

    - id: notify
      name: '@deepseek-ai/dsh-notify'
      config:
        mock: true
