# DSH 插件版 DeerFlow 加载配置
# 用法：pnpm dsh web --patch ./scratch-plugin/cordis.yml

- insert:
    - id: amazon-ops-bridge
      name: '@deepseek-ai/dsh-amazon-ops-bridge'
      config:
        baseUrl: 'http://127.0.0.1:8001'
        mock: false

    - id: scheduler
      name: '@deepseek-ai/dsh-scheduler'
      config:
        dataPath: '.dsh-scheduler-jobs.json'
        scanIntervalSeconds: 60

    - id: memory
      name: '@deepseek-ai/dsh-memory'
      config:
        dataPath: '.dsh-memory.json'

    - id: notify
      name: '@deepseek-ai/dsh-notify'
      config:
        mock: true

    - id: rbac
      name: '@deepseek-ai/dsh-rbac'
      config:
        role: admin
        deny: []

    - id: deerflow
      name: 'deerflow-dsh'
      config:
        # DeerFlow 2.0 SuperAgent：Lead Agent 分解→skills 分发→收敛。
        # LLM 走火山方舟 plan 兼容端点（ARK_API_KEY），搜索用豆包（同 key），
        # 爬取用 local（免 key 直连 + 本地 HTML→Markdown，r.jina.ai 被墙不可用）。
        leadModel: ark-code-latest
        defaultMode: pro
        maxSubAgents: 6
        searchProvider: doubao
        searchApiKey: ''
        searchApiKeyEnv: ARK_API_KEY
        crawlProvider: local
        crawlApiKey: ''
        crawlApiKeyEnv: JINA_API_KEY
        pythonCommand: python
        researchMaxSteps: 3
        # research 子任务含多次 LLM 调用 + 真实搜索，默认 120s 会被中途杀掉。
        middlewareTimeoutMs: 600000
