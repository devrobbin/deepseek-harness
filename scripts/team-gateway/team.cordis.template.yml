# 团队部署：每运营人一个 DSH 实例（方案 A）
#
# 本模板由 scripts/team-gateway/start-operator.mjs 渲染成每用户的
# overlay（替换 {{DATA_DIR}} 占位符后经 --patch 加载，优先级最高）。
# memory / scheduler 的数据路径按用户隔离；其余字段为共享部署值。

- insert:
    - id: amazon-ops-bridge
      name: '@deepseek-ai/dsh-amazon-ops-bridge'
      config:
        # 一人一套 amazon_ops：{{OPS_URL}} 由启动器按该运营的 opsPort 渲染
        baseUrl: '{{OPS_URL}}'
        mock: false
        apiToken: '{{OPS_TOKEN}}'

    - id: scheduler
      name: '@deepseek-ai/dsh-scheduler'
      config:
        dataPath: '{{DATA_DIR}}/scheduler-jobs.json'
        scanIntervalSeconds: 60

    - id: memory
      name: '@deepseek-ai/dsh-memory'
      config:
        dataPath: '{{DATA_DIR}}/memory.json'

    - id: notify
      name: '@deepseek-ai/dsh-notify'
      config:
        mock: true

    - id: rbac
      name: '@deepseek-ai/dsh-rbac'
      config:
        role: admin
        deny: []

    - id: amazon-ops-skill
      name: '@deepseek-ai/dsh-amazon-ops-skill'

    - id: ui-ops-dashboard
      name: '@deepseek-ai/dsh-client-ui-ops-dashboard'

# 能力移除（越界读防线）：电商运营不需要编码 agent 的任意文件读写工具。
# 没有能读任意路径的工具，就没有"A 会话读 B 的 memory.json / 密钥文件"。
# 行 id 与 dsh-base 组合一致；--patch 的 id 级禁用最后生效。
- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-bash
  disabled: true
